```yaml
name: Docker

on:
  workflow_dispatch:

  push:
    branches:
      - new
    paths:
      - 'images.txt'
      - '.github/workflows/docker.yml'

  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

concurrency:
  group: docker-image-pusher
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. Maximize build disk space
      # ==========================================
      - name: Maximize build disk space
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo " Docker storage optimization"
          echo "======================================"

          echo "===== Initial disk status ====="
          df -hT

          echo "===== Stop Docker and containerd ====="
          sudo systemctl stop docker.socket || true
          sudo systemctl stop docker || true
          sudo systemctl stop containerd

          echo "===== Prepare Docker storage ====="
          sudo mkdir -p /var/lib/docker

          echo "===== Prepare containerd storage ====="
          if [ -L /var/lib/containerd ]; then
            echo "containerd is already migrated."
            sudo readlink -f /var/lib/containerd

          else
            sudo mkdir -p /var/lib/docker/containerd

            if [ -d /var/lib/containerd ]; then
              echo "Migrating containerd data..."

              sudo rsync -aHAX --numeric-ids \
                /var/lib/containerd/ \
                /var/lib/docker/containerd/

              sudo rm -rf /var/lib/containerd
            fi

            sudo ln -s \
              /var/lib/docker/containerd \
              /var/lib/containerd
          fi

          echo "===== Verify containerd symlink ====="
          test -L /var/lib/containerd
          test -d /var/lib/containerd

          sudo ls -ld /var/lib/containerd
          sudo readlink -f /var/lib/containerd

          echo "===== Start containerd and Docker ====="
          sudo systemctl start containerd
          sudo systemctl start docker

          echo "===== Check services ====="
          sudo systemctl is-active --quiet containerd
          sudo systemctl is-active --quiet docker

          echo "===== Docker information ====="
          docker info

          echo "===== Docker storage directory ====="
          docker info --format '{{.DockerRootDir}}'

          echo "===== Disk status ====="
          df -hT

          sudo df -hT /var/lib/docker
          sudo df -hT /var/lib/containerd

          echo "===== Storage usage ====="
          sudo du -sh /var/lib/docker
          sudo du -sh /var/lib/containerd

          echo "===== Storage optimization completed ====="

      # ==========================================
      # 3. Clean unnecessary files
      # ==========================================
      - name: Clean runner disk
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "===== Clean unnecessary packages ====="

          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

          echo "===== Clean apt cache ====="
          sudo apt-get clean

          echo "===== Disk status ====="
          df -hT

      # ==========================================
      # 4. Login to Aliyun Registry
      # ==========================================
      - name: Login to Aliyun Registry
        shell: bash
        env:
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "$ALIYUN_PASSWORD" | docker login \
            "$ALIYUN_REGISTRY" \
            -u "$ALIYUN_USERNAME" \
            --password-stdin

      # ==========================================
      # 5. Push Docker images
      # ==========================================
      - name: Push Docker images
        shell: bash
        env:
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
        run: |
          set -Eeuo pipefail

          if [ ! -f images.txt ]; then
            echo "images.txt not found!"
            exit 1
          fi

          while IFS= read -r image || [ -n "$image" ]; do

            image="${image%%#*}"
            image="$(echo "$image" | xargs)"

            [ -z "$image" ] && continue

            echo "======================================"
            echo "Processing: $image"
            echo "======================================"

            name="${image##*/}"
            target="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/${name}"

            echo "Source: $image"
            echo "Target: $target"

            docker pull "$image"

            docker tag "$image" "$target"

            docker push "$target"

            echo "Successfully pushed: $target"

            docker image rm "$image" "$target" || true

            echo "===== Current disk status ====="
            df -h /var/lib/docker

          done < images.txt

      # ==========================================
      # 6. Logout and cleanup
      # ==========================================
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          echo "===== Docker cleanup ====="

          docker logout "${{ secrets.ALIYUN_REGISTRY }}" || true

          docker image prune -af || true
          docker builder prune -af || true

          echo "===== Final disk status ====="
          df -hT

          sudo df -hT /var/lib/docker || true

          echo "===== Workflow completed ====="
```
